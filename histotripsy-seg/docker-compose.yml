# Usage examples:
#   docker compose run --rm train
#   docker compose run --rm evaluate
#   docker compose run --rm predict
x-common: &common
  image: histotripsy-seg:1.0.0
  build:
    context: .
    target: runtime
    args:
      VERSION: "1.0.0"
  init: true                    # proper signal handling / zombie reaping
  read_only: true               # immutable root filesystem
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  shm_size: "1gb"               # PyTorch DataLoader workers need shared memory

services:
  train:
    <<: *common
    command: ["src.train", "--config", "configs/default.yaml"]
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs

  evaluate:
    <<: *common
    command: ["src.evaluate", "--ckpt", "runs/exp1/best.pt", "--data_dir", "data/synthetic"]
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro

  predict:
    <<: *common
    command: ["src.predict", "--ckpt", "runs/exp1/best.pt", "--input", "data/synthetic/images", "--out", "preds"]
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro
      - ./preds:/app/preds
